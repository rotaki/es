[package]
name = "myung"
version = "0.1.0"
edition = "2024"
description = "Faithful port of Myung et al. (IEEE TC 2021) NVMe external sort framework, as a baseline for CrocSort comparison"

[dependencies]
es = { path = "../.." }
libc = "0.2"
rand = "0.9.2"
clap = { version = "4.5.2", features = ["derive"] }
crossbeam = "0.8.4"

[dev-dependencies]
tempfile = "3.2"

[[example]]
name = "myung_sort_cli"
path = "examples/myung_sort_cli.rs"
